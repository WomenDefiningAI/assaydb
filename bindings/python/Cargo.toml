[package]
name = "assaydb-python"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/WomenDefiningAI/assaydb"

[lib]
name = "_native"
crate-type = ["cdylib"]

# Bindings have their own dependency resolution, never the frozen engine lock.
[workspace]

# Keep the extension on the same decoder implementation as the CLI.
[patch.crates-io]
parquet = { path = "../../vendor/parquet-57.0.0-decoder-v1" }

[dependencies]
assaydb = { path = "../.." }
arrow = { version = "=57.0.0", default-features = false, features = ["ipc"] }
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py310"] }

[profile.release]
debug = 0
strip = "debuginfo"
lto = "thin"
codegen-units = 1
